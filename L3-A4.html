<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      * {
        text-align: center;
        font-family: cursive;
      }
      #text {
        text-shadow: 5px 5px 2px burlywood;
      }
      #box {
        box-shadow: 20px 10px 9px palevioletred;
      }
      #indent {
        text-indent: 100px;
        color: cadetblue;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <h1 id="text">we can use text-shadow to give shadow to text itself</h1>
    <h1 id="box">or use box-shadow to give shadow to the element</h1>
    <div>
      <p>this is an example of text text-indent</p>
      <p id="indent">this is an example of text text-indent</p>
    </div>
  </body>
</html>
